<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- The navbar's pixel JD. wordmark. The Navbar points the href at
       #dusk (cream letters) or #dawn (navy) so the favicon follows the
       World's sky; until React mounts, the media query gives an OS-scheme
       default. The nested group ids must stay "dusk" and "dawn". -->
  <style>
    .t { fill: #233047; }
    @media (prefers-color-scheme: dark) { .t { fill: #FFF4E3; } }
    #dusk:target .t { fill: #FFF4E3; }
    #dawn:target .t { fill: #233047; }
  </style>
  <g id="dusk"><g id="dawn">
    <!-- J -->
    <rect class="t" x="0" y="4" width="6" height="2"/>
    <rect class="t" x="4" y="6" width="2" height="5"/>
    <rect class="t" x="0" y="9" width="2" height="2"/>
    <rect class="t" x="0" y="11" width="5" height="2"/>
    <!-- D -->
    <rect class="t" x="7" y="4" width="2" height="9"/>
    <rect class="t" x="9" y="4" width="3" height="2"/>
    <rect class="t" x="9" y="11" width="3" height="2"/>
    <rect class="t" x="11" y="6" width="2" height="5"/>
    <!-- the gold period -->
    <rect x="14" y="11" width="2" height="2" fill="#FFC94D"/>
  </g></g>
</svg>
